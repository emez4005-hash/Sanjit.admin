<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sanjit.io | Admin Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #020617;
      --sidebar: #0f172a;
      --card: #111827;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #06b6d4;
      --blue: #6366f1;
      --danger: #f87171;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    /* =========================
       LAYOUT
    ========================= */

    .dashboard {
      min-height: 100vh;
      display: flex;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 250px;
      min-height: 100vh;

      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;

      padding: 24px 16px;

      background:
        linear-gradient(
          180deg,
          #0f172a,
          #020617
        );

      border-right: 1px solid var(--border);

      z-index: 100;
    }

    .brand {
      padding: 8px 12px 30px;

      font-size: 24px;
      font-weight: 900;
    }

    .brand span {
      color: var(--cyan);
    }

    .admin-label {
      padding: 10px 12px;
      margin-bottom: 18px;

      border-radius: 12px;

      background: rgba(255,255,255,.04);

      color: var(--muted);

      font-size: 12px;
    }

    .admin-label strong {
      display: block;

      margin-top: 4px;

      color: white;

      font-size: 13px;

      word-break: break-word;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .nav {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .nav-btn {
      width: 100%;

      padding: 13px 14px;

      display: flex;
      align-items: center;
      gap: 12px;

      border: 0;
      border-radius: 12px;

      background: transparent;

      color: var(--muted);

      font-size: 14px;
      font-weight: 600;

      text-align: left;

      cursor: pointer;

      transition: .2s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(6,182,212,.10);

      color: white;

      transform: translateX(2px);
    }

    .nav-icon {
      width: 22px;

      text-align: center;

      font-size: 17px;
    }

    /* =========================
       LOGOUT
    ========================= */

    .logout-btn {
      position: absolute;

      left: 16px;
      right: 16px;
      bottom: 24px;

      width: calc(100% - 32px);

      padding: 12px;

      border: 1px solid rgba(248,113,113,.25);

      border-radius: 12px;

      background: rgba(248,113,113,.05);

      color: var(--danger);

      font-weight: 700;

      cursor: pointer;

      transition: .2s ease;
    }

    .logout-btn:hover {
      background: rgba(248,113,113,.12);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      width: calc(100% - 250px);

      margin-left: 250px;

      padding: 30px;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 30px;

      margin-bottom: 6px;
    }

    .welcome p {
      color: var(--muted);

      font-size: 14px;
    }

    .status {
      padding: 9px 14px;

      border: 1px solid rgba(74,222,128,.20);

      border-radius: 999px;

      background: rgba(74,222,128,.07);

      color: #4ade80;

      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 18px;
    }

    .stat-card {
      position: relative;

      overflow: hidden;

      padding: 22px;

      border: 1px solid var(--border);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(17,24,39,.95),
          rgba(15,23,42,.90)
        );

      transition: .25s ease;
    }

    .stat-card:hover {
      transform: translateY(-3px);

      border-color: rgba(6,182,212,.25);
    }

    .stat-icon {
      width: 45px;
      height: 45px;

      display: grid;
      place-items: center;

      margin-bottom: 16px;

      border-radius: 13px;

      background: rgba(6,182,212,.10);

      font-size: 20px;
    }

    .stat-card small {
      color: var(--muted);

      font-size: 13px;
    }

    .stat-card h2 {
      margin-top: 7px;

      font-size: 30px;
    }

    /* =========================
       CONTENT
    ========================= */

    .content-grid {
      display: grid;

      grid-template-columns:
        1.4fr
        1fr;

      gap: 20px;

      margin-top: 22px;
    }

    .panel {
      padding: 24px;

      border: 1px solid var(--border);

      border-radius: 20px;

      background: var(--card);
    }

    .panel-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 20px;
    }

    .panel-header h2 {
      font-size: 19px;
    }

    .panel-header span {
      color: var(--muted);

      font-size: 12px;
    }

    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-actions {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 12px;
    }

    .action {
      padding: 17px;

      border: 1px solid var(--border);

      border-radius: 14px;

      background: #0b1220;

      color: white;

      text-align: left;

      cursor: pointer;

      transition: .2s ease;
    }

    .action:hover {
      border-color: var(--cyan);

      transform: translateY(-2px);
    }

    .action-icon {
      display: block;

      margin-bottom: 9px;

      font-size: 22px;
    }

    .action strong {
      display: block;

      margin-bottom: 4px;
    }

    .action small {
      color: var(--muted);

      font-size: 12px;
    }

    /* =========================
       ACTIVITY
    ========================= */

    .activity {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .activity-item {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 13px;

      border-radius: 12px;

      background: #0b1220;
    }

    .activity-icon {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      flex-shrink: 0;

      border-radius: 10px;

      background: rgba(99,102,241,.12);
    }

    .activity-text {
      font-size: 13px;
    }

    .activity-text small {
      display: block;

      margin-top: 3px;

      color: var(--muted);

      font-size: 11px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      opacity: .55;
    }

    /* =========================
       MOBILE MENU
    ========================= */

    .mobile-header {
      display: none;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {

      .sidebar {
        width: 100%;

        min-height: auto;

        position: relative;

        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .dashboard {
        display: block;
      }

      .main {
        width: 100%;

        margin-left: 0;

        padding: 20px;
      }

      .logout-btn {
        position: static;

        width: 100%;

        margin-top: 20px;
      }

      .brand {
        padding-bottom: 20px;
      }

      .topbar {
        align-items: flex-start;

        flex-direction: column;
      }

      .welcome h1 {
        font-size: 25px;
      }
    }

    @media (max-width: 500px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 15px;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>
